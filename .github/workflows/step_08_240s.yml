name: step-08-240s
"on":
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: "Task 1: Whoami"
        run: whoami && pwd
      - name: "Pause 1"
        run: sleep 76
      - name: "Task 2: Echo greeting"
        run: "echo \"hello step 8 (240s)\""
      - name: "Task 3: Show time"
        run: "date -u +'%Y-%m-%dT%H:%M:%SZ'"
      - name: "Pause 2"
        run: sleep 76
      - name: "Task C: gcc sum_c"
        run: |
          cat > /tmp/h.c <<'C'
          #include <stdio.h>
          int main(void){ int a=7,b=6; printf("sum=%d\n",a+b); return 0; }
          C
          gcc /tmp/h.c -o /tmp/h && /tmp/h
      - name: "Task py"
        run: "python3 -c \"print(2**8)\""
      - name: "Pause 3"
        run: sleep 76
      - name: "Task marker r8"
        run: echo marker=round-8-dur-240
