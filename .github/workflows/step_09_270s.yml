name: step-09-270s
"on":
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: "Task 1: Echo greeting"
        run: "echo \"hello step 9 (270s)\""
      - name: "Pause 1"
        run: sleep 86
      - name: "Task 2: Show time"
        run: "date -u +'%Y-%m-%dT%H:%M:%SZ'"
      - name: "Task 3: System info"
        run: uname -srm
      - name: "Pause 2"
        run: sleep 86
      - name: "Task C: gcc double_c"
        run: |
          cat > /tmp/h.c <<'C'
          #include <stdio.h>
          int main(void){ printf("double=%d\n", 21*2); return 0; }
          C
          gcc /tmp/h.c -o /tmp/h && /tmp/h
      - name: "Task py"
        run: "python3 -c \"print('py step 9')\""
      - name: "Pause 3"
        run: sleep 86
      - name: "Task marker r9"
        run: echo marker=round-9-dur-270
