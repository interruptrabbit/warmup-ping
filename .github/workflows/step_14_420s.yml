name: step-14-420s
"on":
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: "Task 1: Show time"
        run: "date -u +'%Y-%m-%dT%H:%M:%SZ'"
      - name: "Pause 1"
        run: sleep 136
      - name: "Task 2: System info"
        run: uname -srm
      - name: "Task 3: Whoami"
        run: whoami && pwd
      - name: "Pause 2"
        run: sleep 136
      - name: "Task C: gcc double_c"
        run: |
          cat > /tmp/h.c <<'C'
          #include <stdio.h>
          int main(void){ printf("double=%d\n", 21*2); return 0; }
          C
          gcc /tmp/h.c -o /tmp/h && /tmp/h
      - name: "Task py"
        run: "python3 -c \"print(sum(range(10)))\""
      - name: "Pause 3"
        run: sleep 136
      - name: "Task marker r14"
        run: echo marker=round-14-dur-420
