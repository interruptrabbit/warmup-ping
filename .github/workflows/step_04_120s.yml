name: step-04-120s
"on":
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: "Task 1: Whoami"
        run: whoami && pwd
      - name: "Pause 1"
        run: sleep 36
      - name: "Task 2: Echo greeting"
        run: "echo \"hello step 4 (120s)\""
      - name: "Task 3: Show time"
        run: "date -u +'%Y-%m-%dT%H:%M:%SZ'"
      - name: "Pause 2"
        run: sleep 36
      - name: "Task C: gcc double_c"
        run: |
          cat > /tmp/h.c <<'C'
          #include <stdio.h>
          int main(void){ printf("double=%d\n", 21*2); return 0; }
          C
          gcc /tmp/h.c -o /tmp/h && /tmp/h
      - name: "Task py"
        run: "python3 -c \"print(2**8)\""
      - name: "Pause 3"
        run: sleep 36
      - name: "Task marker r4"
        run: echo marker=round-4-dur-120
