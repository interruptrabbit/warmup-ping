name: step-07-210s
"on":
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: "Task 1: System info"
        run: uname -srm
      - name: "Pause 1"
        run: sleep 66
      - name: "Task 2: Whoami"
        run: whoami && pwd
      - name: "Task 3: Echo greeting"
        run: "echo \"hello step 7 (210s)\""
      - name: "Pause 2"
        run: sleep 66
      - name: "Task C: gcc count_c"
        run: |
          cat > /tmp/h.c <<'C'
          #include <stdio.h>
          int main(void){ for(int i=1;i<=5;i++) printf("n=%d\n",i); return 0; }
          C
          gcc /tmp/h.c -o /tmp/h && /tmp/h
      - name: "Task py"
        run: "python3 -c \"print('len', len('warmup'))\""
      - name: "Pause 3"
        run: sleep 66
      - name: "Task marker r7"
        run: echo marker=round-7-dur-210
