name: step-18-540s
"on":
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: "Task 1: Show time"
        run: "date -u +'%Y-%m-%dT%H:%M:%SZ'"
      - name: "Pause 1"
        run: sleep 176
      - name: "Task 2: System info"
        run: uname -srm
      - name: "Task 3: Whoami"
        run: whoami && pwd
      - name: "Pause 2"
        run: sleep 176
      - name: "Task C: gcc sum_c"
        run: |
          cat > /tmp/h.c <<'C'
          #include <stdio.h>
          int main(void){ int a=7,b=6; printf("sum=%d\n",a+b); return 0; }
          C
          gcc /tmp/h.c -o /tmp/h && /tmp/h
      - name: "Task py"
        run: "python3 -c \"print(sum(range(10)))\""
      - name: "Pause 3"
        run: sleep 176
      - name: "Task marker r18"
        run: echo marker=round-18-dur-540
