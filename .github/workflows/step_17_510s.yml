name: step-17-510s
"on":
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: "Task 1: Echo greeting"
        run: "echo \"hello step 17 (510s)\""
      - name: "Pause 1"
        run: sleep 166
      - name: "Task 2: Show time"
        run: "date -u +'%Y-%m-%dT%H:%M:%SZ'"
      - name: "Task 3: System info"
        run: uname -srm
      - name: "Pause 2"
        run: sleep 166
      - name: "Task C: gcc count_c"
        run: |
          cat > /tmp/h.c <<'C'
          #include <stdio.h>
          int main(void){ for(int i=1;i<=5;i++) printf("n=%d\n",i); return 0; }
          C
          gcc /tmp/h.c -o /tmp/h && /tmp/h
      - name: "Task py"
        run: "python3 -c \"print('py step 17')\""
      - name: "Pause 3"
        run: sleep 166
      - name: "Task marker r17"
        run: echo marker=round-17-dur-510
