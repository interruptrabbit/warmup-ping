name: step-03-90s
"on":
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: "Task 1: System info"
        run: uname -srm
      - name: "Pause 1"
        run: sleep 26
      - name: "Task 2: Whoami"
        run: whoami && pwd
      - name: "Task 3: Echo greeting"
        run: "echo \"hello step 3 (90s)\""
      - name: "Pause 2"
        run: sleep 26
      - name: "Task C: gcc sum_c"
        run: |
          cat > /tmp/h.c <<'C'
          #include <stdio.h>
          int main(void){ int a=7,b=6; printf("sum=%d\n",a+b); return 0; }
          C
          gcc /tmp/h.c -o /tmp/h && /tmp/h
      - name: "Task py"
        run: "python3 -c \"print('len', len('warmup'))\""
      - name: "Pause 3"
        run: sleep 26
      - name: "Task marker r3"
        run: echo marker=round-3-dur-90
