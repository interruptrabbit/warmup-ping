name: step-02-60s
"on":
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: "Task 1: Show time"
        run: "date -u +'%Y-%m-%dT%H:%M:%SZ'"
      - name: "Pause 1"
        run: sleep 24
      - name: "Task 2: System info"
        run: uname -srm
      - name: "Task 3: Whoami"
        run: whoami && pwd
      - name: "Pause 2"
        run: sleep 24
      - name: "Task C: gcc count_c"
        run: |
          cat > /tmp/h.c <<'C'
          #include <stdio.h>
          int main(void){ for(int i=1;i<=5;i++) printf("n=%d\n",i); return 0; }
          C
          gcc /tmp/h.c -o /tmp/h && /tmp/h
      - name: "Task py"
        run: "python3 -c \"print(sum(range(10)))\""
      - name: "Task marker r2"
        run: echo marker=round-2-dur-60
