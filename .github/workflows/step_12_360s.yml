name: step-12-360s
"on":
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: "Task 1: Whoami"
        run: whoami && pwd
      - name: "Pause 1"
        run: sleep 116
      - name: "Task 2: Echo greeting"
        run: "echo \"hello step 12 (360s)\""
      - name: "Task 3: Show time"
        run: "date -u +'%Y-%m-%dT%H:%M:%SZ'"
      - name: "Pause 2"
        run: sleep 116
      - name: "Task C: gcc count_c"
        run: |
          cat > /tmp/h.c <<'C'
          #include <stdio.h>
          int main(void){ for(int i=1;i<=5;i++) printf("n=%d\n",i); return 0; }
          C
          gcc /tmp/h.c -o /tmp/h && /tmp/h
      - name: "Task py"
        run: "python3 -c \"print(2**8)\""
      - name: "Pause 3"
        run: sleep 116
      - name: "Task marker r12"
        run: echo marker=round-12-dur-360
